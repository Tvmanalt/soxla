<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SoxlaOS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --accent:#0078d4;
  --accent2:#00a4ef;
  --bg:#0b1117;
  --panel:#1d2229;
  --panel2:#252b33;
  --panel3:#303741;
  --text:#f5f7fa;
  --muted:#9da7b3;
  --danger:#e74c3c;
  --shadow:0 20px 60px rgba(0,0,0,.55);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Segoe UI",system-ui,sans-serif;
  color:var(--text);
}

body{
  background:
    radial-gradient(circle at 20% 20%,rgba(0,120,212,.25),transparent 35%),
    linear-gradient(135deg,#07131e,#102c3b 50%,#14202b);
}

/* LOGIN */

#login{
  position:fixed;
  inset:0;
  z-index:50000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at center,rgba(0,120,212,.18),transparent 45%),
    #070a0f;
}

.login-card{
  width:min(400px,calc(100vw - 30px));
  background:rgba(29,34,41,.96);
  border:1px solid rgba(255,255,255,.1);
  border-radius:20px;
  padding:32px;
  box-shadow:var(--shadow);
}

.login-logo{
  width:72px;
  height:72px;
  margin:auto auto 18px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:32px;
  font-weight:800;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  box-shadow:0 0 35px rgba(0,120,212,.4);
}

.login-card h1{
  text-align:center;
  font-size:27px;
}

.login-card .sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin:7px 0 25px;
}

.login-input{
  width:100%;
  margin-bottom:12px;
  padding:13px 14px;
  border-radius:10px;
  border:1px solid #39414c;
  background:#12171d;
  color:white;
  outline:none;
  font-size:14px;
}

.login-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,120,212,.18);
}

.login-btn{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:var(--accent);
  color:white;
  font-weight:700;
  cursor:pointer;
}

.login-btn:hover{
  background:#1687dc;
}

.login-error{
  color:#ff8277;
  font-size:12px;
  text-align:center;
  min-height:18px;
  margin-bottom:8px;
}

/* DESKTOP */

#desktop{
  position:absolute;
  inset:0 0 58px 0;
  padding:16px;
  display:flex;
  flex-direction:column;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:10px;
}

.desktop-icon{
  width:92px;
  height:96px;
  padding:8px;
  border-radius:10px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
}

.desktop-icon:hover{
  background:rgba(255,255,255,.11);
}

.desktop-icon .icon{
  width:50px;
  height:50px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:25px;
  box-shadow:0 7px 20px rgba(0,0,0,.35);
}

.desktop-icon span{
  font-size:12px;
  text-align:center;
  text-shadow:0 2px 5px #000;
}

/* TASKBAR */

#taskbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:58px;
  background:rgba(15,18,23,.88);
  backdrop-filter:blur(20px);
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  z-index:10000;
}

.tb{
  height:43px;
  min-width:43px;
  padding:0 12px;
  border:0;
  background:transparent;
  color:white;
  border-radius:9px;
  cursor:pointer;
  font-size:18px;
}

.tb:hover,
.tb.active{
  background:rgba(255,255,255,.12);
}

.start-logo{
  width:25px;
  height:25px;
  background:
    conic-gradient(
      from 90deg,
      #f25022 0 90deg,
      #7fba00 90deg 180deg,
      #00a4ef 180deg 270deg,
      #ffb900 270deg
    );
  border-radius:4px;
}

#clock{
  position:absolute;
  right:13px;
  text-align:right;
  font-size:12px;
  line-height:1.3;
}

/* START */

#start{
  position:fixed;
  left:50%;
  bottom:68px;
  transform:translateX(-50%) scale(.95);
  width:min(700px,calc(100vw - 18px));
  background:rgba(25,29,35,.97);
  border:1px solid rgba(255,255,255,.1);
  border-radius:17px;
  padding:18px;
  z-index:11000;
  opacity:0;
  pointer-events:none;
  transition:.18s;
  box-shadow:var(--shadow);
}

#start.show{
  opacity:1;
  pointer-events:auto;
  transform:translateX(-50%) scale(1);
}

.start-search{
  width:100%;
  padding:11px 13px;
  border-radius:9px;
  border:1px solid #3a414b;
  background:#11161c;
  color:white;
  outline:none;
  margin-bottom:15px;
}

.start-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
  gap:9px;
  max-height:330px;
  overflow:auto;
}

.start-item{
  padding:13px 8px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:11px;
  text-align:center;
  cursor:pointer;
}

.start-item:hover{
  background:rgba(255,255,255,.1);
}

.start-item .icon{
  width:42px;
  height:42px;
  border-radius:11px;
  margin:auto auto 8px;
  display:grid;
  place-items:center;
  font-size:21px;
}

.start-item p{
  font-size:12px;
}

/* WINDOWS */

.win{
  position:absolute;
  min-width:300px;
  min-height:200px;
  background:var(--panel);
  border:1px solid rgba(255,255,255,.1);
  border-radius:11px;
  box-shadow:var(--shadow);
  overflow:hidden;
  display:flex;
  flex-direction:column;
  animation:windowIn .18s ease;
}

@keyframes windowIn{
  from{
    opacity:0;
    transform:scale(.95) translateY(8px);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

.win.min{
  display:none;
}

.win.max{
  left:0!important;
  top:0!important;
  width:100%!important;
  height:calc(100% - 58px)!important;
  border-radius:0;
}

.titlebar{
  height:39px;
  background:var(--panel2);
  display:flex;
  align-items:center;
  padding-left:14px;
  flex-shrink:0;
  cursor:grab;
  user-select:none;
}

.titlebar .title{
  flex:1;
  font-size:13px;
  font-weight:600;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.win-buttons{
  height:100%;
  display:flex;
}

.win-buttons button{
  width:45px;
  height:100%;
  border:0;
  background:transparent;
  color:#ddd;
  cursor:pointer;
}

.win-buttons button:hover{
  background:rgba(255,255,255,.1);
}

.win-buttons .close:hover{
  background:var(--danger);
}

.win-body{
  flex:1;
  overflow:auto;
  background:#12161b;
}

/* APP STORE */

.store{
  padding:20px;
}

.store-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.store-head h2{
  font-size:24px;
}

.search{
  padding:9px 12px;
  border-radius:8px;
  background:#181e25;
  border:1px solid #3a424d;
  color:white;
  outline:none;
}

.store-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(165px,1fr));
  gap:13px;
}

.app-card{
  background:#242a32;
  border:1px solid rgba(255,255,255,.06);
  border-radius:13px;
  padding:15px;
}

.app-card:hover{
  background:#2b323b;
}

.app-icon{
  width:56px;
  height:56px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:28px;
  margin-bottom:12px;
}

.app-card h3{
  font-size:14px;
  margin-bottom:4px;
}

.app-card p{
  color:var(--muted);
  font-size:11px;
}

.app-card button{
  width:100%;
  margin-top:12px;
  padding:9px;
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-weight:600;
}

/* APP CONTENT */

.app-content{
  height:100%;
  min-height:400px;
  padding:24px;
}

.app-hero{
  padding:25px;
  border-radius:15px;
  background:
    linear-gradient(135deg,rgba(0,120,212,.35),rgba(0,0,0,.15));
  margin-bottom:18px;
}

.app-hero .big-icon{
  font-size:55px;
  margin-bottom:12px;
}

.app-hero h1{
  font-size:27px;
}

.app-hero p{
  color:var(--muted);
  margin-top:7px;
  line-height:1.5;
}

.app-button{
  padding:10px 17px;
  border:0;
  border-radius:8px;
  background:var(--accent);
  color:white;
  font-weight:600;
  cursor:pointer;
  margin-top:15px;
}

.app-button:hover{
  background:#1687dc;
}

/* DISCORD */

.discord{
  height:100%;
  display:grid;
  grid-template-columns:190px 1fr;
}

.discord-side{
  background:#151820;
  padding:14px;
}

.discord-side h3{
  font-size:13px;
  margin-bottom:13px;
}

.server{
  padding:10px;
  margin-bottom:6px;
  background:#252a35;
  border-radius:7px;
  font-size:12px;
  cursor:pointer;
}

.server:hover{
  background:#303746;
}

.discord-main{
  display:flex;
  flex-direction:column;
}

.discord-head{
  padding:14px;
  border-bottom:1px solid #303641;
  font-weight:600;
}

.discord-chat{
  flex:1;
  padding:18px;
  overflow:auto;
}

.message{
  margin-bottom:16px;
}

.message strong{
  font-size:13px;
}

.message span{
  color:#d3d7de;
  font-size:13px;
  margin-left:7px;
}

.discord-input{
  margin:12px;
  padding:12px;
  border-radius:8px;
  border:0;
  outline:none;
  background:#252b35;
  color:white;
}

/* TIKTOK */

.tiktok{
  height:100%;
  background:#050505;
  display:flex;
  justify-content:center;
  overflow:auto;
}

.tiktok-feed{
  width:min(430px,100%);
}

.tiktok-video{
  height:500px;
  margin-bottom:12px;
  border-radius:12px;
  background:
    linear-gradient(
      135deg,
      #151515,
      #303030
    );
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:22px;
}

.tiktok-video .play{
  font-size:55px;
  text-align:center;
  margin:auto;
}

.tiktok-video h3{
  font-size:15px;
}

.tiktok-video p{
  color:#ccc;
  font-size:12px;
  margin-top:5px;
}

/* SETTINGS */

.settings{
  display:flex;
  height:100%;
}

.settings-nav{
  width:190px;
  background:#171b21;
  padding:12px;
}

.settings-nav button{
  width:100%;
  padding:11px;
  margin-bottom:5px;
  border:0;
  background:transparent;
  color:white;
  text-align:left;
  border-radius:8px;
  cursor:pointer;
}

.settings-nav button:hover,
.settings-nav button.active{
  background:#292f38;
}

.settings-page{
  flex:1;
  padding:22px;
  overflow:auto;
}

.settings-page h2{
  margin-bottom:6px;
}

.settings-page .sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.setting-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px;
  background:#242a32;
  border-radius:10px;
  margin-bottom:9px;
}

.setting-row p{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}

.action{
  border:0;
  border-radius:8px;
  padding:9px 15px;
  background:var(--accent);
  color:white;
  cursor:pointer;
  font-weight:600;
}

/* TOAST */

#toast{
  position:fixed;
  bottom:73px;
  left:50%;
  transform:translate(-50%,20px);
  opacity:0;
  pointer-events:none;
  background:#20252d;
  border:1px solid rgba(255,255,255,.1);
  padding:11px 18px;
  border-radius:9px;
  z-index:30000;
  transition:.2s;
  font-size:13px;
}

#toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* BOOT */

#boot{
  position:fixed;
  inset:0;
  background:#05070a;
  z-index:40000;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:22px;
  transition:.35s;
}

#boot.hide{
  opacity:0;
  pointer-events:none;
}

.boot-logo{
  width:75px;
  height:75px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:linear-gradient(145deg,var(--accent),var(--accent2));
  font-size:30px;
  font-weight:800;
}

.spinner{
  width:28px;
  height:28px;
  border:3px solid #2b3139;
  border-top-color:white;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.boot-text{
  color:#707985;
  font-size:12px;
  letter-spacing:3px;
}

@media(max-width:700px){
  .settings-nav{
    width:65px;
  }

  .settings-nav button{
    font-size:0;
    text-align:center;
  }

  .discord{
    grid-template-columns:120px 1fr;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-card">
    <div class="login-logo">S</div>
    <h1>Welcome to SoxlaOS</h1>
    <div class="sub">Sign in to your local SoxlaOS account</div>

    <input
      id="username"
      class="login-input"
      placeholder="Username"
      autocomplete="username"
    >

    <input
      id="password"
      class="login-input"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <div id="login-error" class="login-error"></div>

    <button class="login-btn" id="login-btn">
      Sign In
    </button>
  </div>
</div>

<!-- BOOT -->
<div id="boot">
  <div class="boot-logo">S</div>
  <div class="spinner"></div>
  <div class="boot-text">SOXLAOS</div>
</div>

<!-- DESKTOP -->
<div id="desktop"></div>

<!-- START -->
<div id="start">
  <input
    id="start-search"
    class="start-search"
    placeholder="Search apps..."
  >

  <div class="start-grid" id="start-grid"></div>
</div>

<!-- TASKBAR -->
<div id="taskbar">

  <button class="tb" id="start-btn">
    <div class="start-logo"></div>
  </button>

  <button class="tb" id="store-btn">
    🛍️
  </button>

  <button class="tb" id="settings-btn">
    ⚙️
  </button>

  <div id="clock"></div>
</div>

<div id="toast"></div>

<script>

/* =========================================================
   SOXLAOS
   Fully internal app system.
   No iframe.
   No window.open.
   No popouts.
   Uses DocumentFragment for app rendering.
========================================================= */

/* ---------- STORAGE ---------- */

function save(key,value){
  try{
    localStorage.setItem(
      "soxla_"+key,
      JSON.stringify(value)
    );
  }catch(e){}
}

function load(key,fallback){
  try{
    const value=localStorage.getItem("soxla_"+key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    return fallback;
  }
}

/* ---------- LOGIN ---------- */

const login=document.getElementById("login");
const usernameInput=document.getElementById("username");
const passwordInput=document.getElementById("password");
const loginError=document.getElementById("login-error");

function signIn(){

  const username=usernameInput.value.trim();
  const password=passwordInput.value;

  if(!username){
    loginError.textContent="Enter a username.";
    return;
  }

  if(password.length<3){
    loginError.textContent="Password must be at least 3 characters.";
    return;
  }

  save("account",{
    username,
    password
  });

  login.style.display="none";

  startBoot();
}

document.getElementById("login-btn")
  .addEventListener("click",signIn);

passwordInput.addEventListener("keydown",e=>{
  if(e.key==="Enter") signIn();
});

const existingAccount=load("account",null);

if(existingAccount){
  usernameInput.value=existingAccount.username;
}

/* ---------- TOAST ---------- */

let toastTimer;

function toast(message){

  const el=document.getElementById("toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

/* ---------- APPS ---------- */

const APPS=[

  {
    id:"store",
    name:"App Store",
    emoji:"🛍️",
    color:"#0078d4",
    category:"System"
  },

  {
    id:"settings",
    name:"Settings",
    emoji:"⚙️",
    color:"#666",
    category:"System"
  },

  {
    id:"roblox",
    name:"Roblox",
    emoji:"🧱",
    color:"#e2231a",
    category:"Game"
  },

  {
    id:"fortnite",
    name:"Fortnite",
    emoji:"🪂",
    color:"#7657ff",
    category:"Game"
  },

  {
    id:"minecraft",
    name:"Minecraft",
    emoji:"⛏️",
    color:"#5b963f",
    category:"Game"
  },

  {
    id:"fallguys",
    name:"Fall Guys",
    emoji:"🍬",
    color:"#ff65c4",
    category:"Game"
  },

  {
    id:"geometry",
    name:"Geometry Dash",
    emoji:"🔷",
    color:"#2ecc71",
    category:"Game"
  },

  {
    id:"cod",
    name:"Call of Duty",
    emoji:"🎯",
    color:"#444",
    category:"Game"
  },

  {
    id:"rocket",
    name:"Rocket League",
    emoji:"🚗",
    color:"#168bea",
    category:"Game"
  },

  {
    id:"melon",
    name:"Melon Sandbox",
    emoji:"🍉",
    color:"#3cb371",
    category:"Game"
  },

  {
    id:"discord",
    name:"Discord",
    emoji:"💬",
    color:"#5865f2",
    category:"Social"
  },

  {
    id:"tiktok",
    name:"TikTok",
    emoji:"♪",
    color:"#111",
    category:"Social"
  }

];

/* Installed apps */

let installed=load(
  "installed",
  APPS.map(a=>a.id)
);

/* ---------- RUNNING WINDOWS ---------- */

const running=new Map();

let zIndex=200;

/* ---------- DFF / DOCUMENT FRAGMENT RENDERER ---------- */

function renderFragment(html){

  const fragment=document.createDocumentFragment();

  const wrapper=document.createElement("div");

  wrapper.innerHTML=html;

  while(wrapper.firstChild){
    fragment.appendChild(wrapper.firstChild);
  }

  return fragment;
}

/* ---------- WINDOW SYSTEM ---------- */

function focusWindow(win){

  zIndex++;

  win.style.zIndex=zIndex;
}

function createWindow(id,title,width=850,height=560){

  /*
    IMPORTANT:
    Do not create another copy if the app is already open.
    Instead focus the existing window.
  */

  const existing=running.get(id);

  if(existing && document.body.contains(existing)){

    existing.classList.remove("min");

    focusWindow(existing);

    return existing;
  }

  running.delete(id);

  const win=document.createElement("div");

  win.className="win";

  win.dataset.app=id;

  const vw=window.innerWidth;
  const vh=window.innerHeight-58;

  const w=Math.min(width,vw-20);
  const h=Math.min(height,vh-20);

  win.style.width=w+"px";
  win.style.height=h+"px";

  win.style.left=
    Math.max(
      10,
      (vw-w)/2+(Math.random()*30-15)
    )+"px";

  win.style.top=
    Math.max(
      10,
      (vh-h)/2+(Math.random()*30-15)
    )+"px";

  const fragment=renderFragment(`
    <div class="titlebar">

      <div class="title">
        ${title}
      </div>

      <div class="win-buttons">

        <button data-action="min">─</button>

        <button data-action="max">□</button>

        <button
          class="close"
          data-action="close">
          ×
        </button>

      </div>

    </div>

    <div class="win-body"></div>
  `);

  win.appendChild(fragment);

  document.body.appendChild(win);

  running.set(id,win);

  focusWindow(win);

  /* focus */

  win.addEventListener("pointerdown",()=>{
    focusWindow(win);
  });

  /* window controls */

  win.querySelector(".win-buttons")
    .addEventListener("click",e=>{

      const action=e.target.dataset.action;

      if(action==="min"){
        win.classList.add("min");
      }

      if(action==="max"){
        win.classList.toggle("max");
      }

      if(action==="close"){

        running.delete(id);

        win.remove();

        rebuildDesktop();

        rebuildStart();
      }

    });

  /* dragging */

  const bar=win.querySelector(".titlebar");

  let drag=null;

  bar.addEventListener("pointerdown",e=>{

    if(e.target.closest("button")) return;

    if(win.classList.contains("max")) return;

    drag={
      x:e.clientX-win.offsetLeft,
      y:e.clientY-win.offsetTop
    };

    bar.setPointerCapture(e.pointerId);
  });

  bar.addEventListener("pointermove",e=>{

    if(!drag) return;

    win.style.left=
      Math.max(
        0,
        e.clientX-drag.x
      )+"px";

    win.style.top=
      Math.max(
        0,
        e.clientY-drag.y
      )+"px";
  });

  bar.addEventListener("pointerup",()=>{
    drag=null;
  });

  bar.addEventListener("dblclick",()=>{
    win.classList.toggle("max");
  });

  return win;
}

/* ---------- OPEN APP ---------- */

function openApp(id){

  toggleStart(false);

  const app=APPS.find(a=>a.id===id);

  if(!app) return;

  if(!installed.includes(id)){

    toast(app.name+" is not installed.");

    return;
  }

  /*
    This fixes the "already running" issue.
    There is no fake global running flag.
    We check the actual window.
  */

  if(running.has(id)){

    const old=running.get(id);

    if(document.body.contains(old)){

      old.classList.remove("min");

      focusWindow(old);

      toast(app.name+" is already open.");

      return;
    }

    running.delete(id);
  }

  switch(id){

    case"store":
      openStore();
      break;

    case"settings":
      openSettings();
      break;

    case"discord":
      openDiscord();
      break;

    case"tiktok":
      openTikTok();
      break;

    default:
      openGame(id);
  }
}

/* ---------- APP STORE ---------- */

function openStore(){

  toggleStart(false);

  const win=createWindow(
    "store",
    "Soxla Store",
    900,
    600
  );

  const body=win.querySelector(".win-body");

  body.innerHTML="";

  const fragment=renderFragment(`

    <div class="store">

      <div class="store-head">

        <h2>App Store</h2>

        <input
          id="store-search"
          class="search"
          placeholder="Search apps..."
        >

      </div>

      <div
        class="store-grid"
        id="store-grid">
      </div>

    </div>

  `);

  body.appendChild(fragment);

  const grid=body.querySelector("#store-grid");

  function buildStore(){

    grid.innerHTML="";

    const frag=document.createDocumentFragment();

    APPS.forEach(app=>{

      const card=document.createElement("div");

      card.className="app-card";

      card.dataset.id=app.id;

      const isInstalled=
        installed.includes(app.id);

      card.innerHTML=`

        <div
          class="app-icon"
          style="background:${app.color}">
          ${app.emoji}
        </div>

        <h3>${app.name}</h3>

        <p>${app.category}</p>

        <button>
          ${isInstalled?"Open":"Install"}
        </button>

      `;

      frag.appendChild(card);
    });

    grid.appendChild(frag);
  }

  buildStore();

  grid.addEventListener("click",e=>{

    const card=e.target.closest(".app-card");

    if(!card) return;

    const id=card.dataset.id;

    if(installed.includes(id)){

      openApp(id);

      return;
    }

    installed.push(id);

    save("installed",installed);

    toast(
      APPS.find(a=>a.id===id).name+
      " installed"
    );

    buildStore();

    rebuildDesktop();
    rebuildStart();
  });

  body.querySelector("#store-search")
    .addEventListener("input",e=>{

      const q=e.target.value.toLowerCase();

      grid.querySelectorAll(".app-card")
        .forEach(card=>{

          const id=card.dataset.id;

          const app=APPS.find(a=>a.id===id);

          card.style.display=
            app.name.toLowerCase().includes(q)
              ? ""
              : "none";
        });
    });
}

  desktop.innerHTML="";

  const frag=document.createDocumentFragment();

  APPS
    .filter(app=>installed.includes(app.id))
    .forEach(app=>{

      const icon=document.createElement("div");

      icon.innerHTML=`

          class="icon"

        </div>

      icon.addEventListener("click",()=>{
        openApp(app.id);

      frag.appendChild(icon);

}

/* ---------- START MENU ---------- */

function toggleStart(force){

  const start=document.getElementById("start");

  const show=
    force===true
      ? true
      : force===false
        ? false
        : !start.classList.contains("show");

  start.classList.toggle("show",show);

  document.getElementById("start-btn")
    .classList.toggle("active",show);

  if(show){

    const input=
      document.getElementById("start-search");

    input.value="";
    input.focus();

    filterStart("");
  }
}

document.getElementById("start-btn")
  .addEventListener("click",e=>{

    e.stopPropagation();

    toggleStart();
  });

document.addEventListener("pointerdown",e=>{

  const start=document.getElementById("start");
  const btn=document.getElementById("start-btn");

  if(
    start.classList.contains("show") &&
    !start.contains(e.target) &&
    !btn.contains(e.target)
  ){
    toggleStart(false);
  }
});

/* ---------- SEARCH ---------- */

function filterStart(query){

  document.querySelectorAll(
    ".start-item"
  ).forEach(item=>{

    item.style.display=
      item.dataset.name.includes(query)
        ? ""
        : "none";
  });
}

document.getElementById("start-search")
  .addEventListener("input",e=>{

    filterStart(
      e.target.value.toLowerCase()
    );
  });

/* ---------- CLOCK ---------- */

function updateClock(){

  const now=new Date();

  const time=now.toLocaleTimeString([],{
    hour:"numeric",
    minute:"2-digit"
  });

  const date=now.toLocaleDateString([],{
    month:"numeric",
    day:"numeric",
    year:"numeric"
  });

  document.getElementById("clock")
    .innerHTML=
      time+
      "<br>"+
      date;
}

setInterval(updateClock,1000);

updateClock();

/* ---------- SECURITY ---------- */

function escapeHTML(text){

  return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

/* ---------- BOOT ---------- */

function startBoot(){

  const boot=document.getElementById("boot");

  boot.classList.remove("hide");

  setTimeout(()=>{

    boot.classList.add("hide");

    setTimeout(()=>{

      rebuildDesktop();
      rebuildStart();

    },350);

  },450);
}
