<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SoxlaOS</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --accent:#0078d4;
  --accent2:#00b7ff;
  --bg:#0d1117;
  --window:#171a21;
  --header:#20242d;
  --card:#242933;
  --text:#f5f7fa;
  --muted:#9ca3af;
  --danger:#d33;
  --taskbar:rgba(15,17,22,.92);
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Segoe UI",system-ui,sans-serif;
  color:var(--text);
}

body{
  background:
    radial-gradient(circle at 20% 20%,#145b91 0,transparent 35%),

}

/* BOOT */

#boot{
  position:fixed;
  inset:0;
  z-index:99999;
  background:#050608;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:22px;
  transition:opacity .35s;
}

#boot.hide{
  opacity:0;
  pointer-events:none;
}

.boot-logo{
  width:76px;
  height:76px;
  border-radius:20px;
  display:grid;
  place-items:center;
  font-size:32px;
  font-weight:800;
  background:linear-gradient(145deg,#0078d4,#00b7ff);
  box-shadow:0 0 50px rgba(0,150,255,.45);
}

.boot-spinner{
  width:30px;
  height:30px;
  border:3px solid #252a33;
  border-top-color:white;
  border-radius:50%;
  animation:spin .7s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

/* DESKTOP */

#desktop{
  position:absolute;
  inset:0 0 58px 0;
  padding:16px;
  display:flex;
  flex-direction:column;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:8px;
}

.desktop-icon{
  width:92px;
  height:100px;
  border-radius:12px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  cursor:pointer;
  transition:.15s;
}

.desktop-icon:hover{
  background:rgba(255,255,255,.11);
}

.desktop-icon .icon{
  width:50px;
  height:50px;
  border-radius:13px;
  display:grid;
  place-items:center;
  font-size:26px;
  box-shadow:0 7px 18px rgba(0,0,0,.35);
}

.desktop-icon span{
  font-size:12px;
  text-align:center;
  text-shadow:0 1px 4px #000;
}

/* TASKBAR */

#taskbar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:58px;
  z-index:9000;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:5px;
  background:var(--taskbar);
  border-top:1px solid rgba(255,255,255,.1);
  backdrop-filter:blur(25px);
}

.tb{
  width:44px;
  height:44px;
  border:0;
  border-radius:9px;
  background:transparent;
  color:white;
  cursor:pointer;
  font-size:20px;
}

.tb:hover,
.tb.active{
  background:rgba(255,255,255,.12);
}

#start-logo{
  width:24px;

}

#start-logo:after{
  content:"";

}

#clock{

  font-size:12px;

}

/* START */

#start{
  position:fixed;
  left:50%;
  bottom:68px;
  transform:translateX(-50%) scale(.95);
  width:min(680px,calc(100vw - 18px));
  max-height:75vh;
  overflow:hidden;
  padding:18px;
  border-radius:17px;
  background:rgba(25,28,35,.97);
  border:1px solid rgba(255,255,255,.1);
  box-shadow:0 25px 70px rgba(0,0,0,.6);
  z-index:9100;
  opacity:0;
  pointer-events:none;
  transition:.15s;
}

#start.show{
  opacity:1;

}

.start-search{

}

.start-grid{

}

.start-item{
  padding:13px 7px;

}

.start-item:hover{

}

.start-item .ico{
  width:42px;

}

.start-item p{

}

/* WINDOWS */

.win{
  position:absolute;
  min-width:310px;
  min-height:210px;
  background:var(--window);
  border:1px solid rgba(255,255,255,.11);
  border-radius:11px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  box-shadow:0 22px 65px rgba(0,0,0,.55);
  animation:windowIn .16s ease;
}

@keyframes windowIn{
  from{
    opacity:0;
    transform:scale(.96) translateY(8px);
  }
  to{
    opacity:1;
    transform:none;
  }
}

.win.max{
  left:0!important;
  top:0!important;
  width:100%!important;
  height:calc(100% - 58px)!important;
  border-radius:0;
}

.win.min{
  display:none;
}

.titlebar{
  height:40px;

  display:flex;
  align-items:center;
  padding-left:14px;

}

.titlebar .title{
  flex:1;
  font-size:13px;

}

.window-buttons{
  display:flex;
  height:100%;
}

.window-buttons button{

}

.window-buttons button:hover{

}

.window-buttons .close:hover{

}

.win-body{

}

.app{

}

button.action{

}

button.action:hover{

}

button.secondary{

.auth{

.auth-box .action{

.auth-msg{

/* STORE */

.store{
  padding:20px;
}

.store-head{
  display:flex;

}

.search{

.store-grid{

.app-card{

.app-icon{

.app-card h3{

.app-card p{

.app-card button{

.discord{

.message{

.chat-input{

.tiktok{

.settings-nav button:hover,

.settings-page{

.wallpapers{

.wallpaper{

/* TOAST */

#toast{

  padding:11px 18px;

  opacity:0;

}

  }

    font-size:0;
    text-align:center;
  }

  }

</style>

  }
];

const WALLPAPERS = [
  "linear-gradient(135deg,#0f2027,#203a43,#2c5364)",
  "linear-gradient(160deg,#0c64c0,#5b2c6f,#1a1a2e)",
  "linear-gradient(180deg,#ff6a3d,#c44569,#2c1654)",
  "linear-gradient(180deg,#134e4a,#042f2e)",
  "linear-gradient(120deg,#0f0c29,#302b63,#24243e)",
  "linear-gradient(180deg,#2193b0,#6dd5ed)",
  "linear-gradient(180deg,#232526,#414345)",
  "linear-gradient(135deg,#8e0e00,#1f1c18)"
];

/* -----------------------------
   STATE
----------------------------- */

let zIndex = 100;
let installed = load("installed",[]);
let currentUser = load("user",null);

/* -----------------------------
   STORAGE
----------------------------- */

function save(key,value){
  try{
    localStorage.setItem(
      "soxla_"+key,
      JSON.stringify(value)
    );
  }catch(e){}
}

function load(key,fallback){
  try{
    const value=localStorage.getItem("soxla_"+key);
    return value ? JSON.parse(value) : fallback;
  }catch(e){
    return fallback;
  }
}

/* -----------------------------
   HELPERS
----------------------------- */

function $(selector,root=document){
  return root.querySelector(selector);
}

function toast(message){
  const el=$("#toast");

  el.textContent=message;
  el.classList.add("show");

  clearTimeout(el.timer);

  el.timer=setTimeout(()=>{
    el.classList.remove("show");
  },2200);
}

/* -----------------------------
   CLOCK
----------------------------- */

function updateClock(){
  const d=new Date();

  const time=d.toLocaleTimeString([],{
    hour:"numeric",
    minute:"2-digit"
  });

  const date=d.toLocaleDateString([],{
    month:"numeric",
    day:"numeric",
    year:"numeric"
  });

  $("#clock").innerHTML=time+"<br>"+date;
}

setInterval(updateClock,1000);
updateClock();

/* -----------------------------
   START MENU
----------------------------- */

function toggleStart(force){

  const start=$("#start");

  const show =
    force !== undefined
      ? force
      : !start.classList.contains("show");

  start.classList.toggle("show",show);
  $("#start-btn").classList.toggle("active",show);

  if(show){
    $("#start-search").value="";
    filterStart("");
    $("#start-search").focus();
  }
}

document.addEventListener("pointerdown",e=>{

  const start=$("#start");

  if(
    start.classList.contains("show") &&
    !start.contains(e.target) &&
    !e.target.closest("#start-btn")
  ){
    toggleStart(false);
  }

});

/* -----------------------------
   WINDOWS
----------------------------- */

function createWindow(options){

  const existing=
    document.getElementById("win-"+options.id);

  if(existing){

    existing.classList.remove("min");
    existing.style.zIndex=++zIndex;

    return existing;
  }

  const win=document.createElement("div");

  win.className="win";
  win.id="win-"+options.id;

  const vw=innerWidth;
  const vh=innerHeight-58;

  const width=Math.min(
    options.width||850,
    vw-20
  );

  const height=Math.min(
    options.height||560,
    vh-20
  );

  win.style.width=width+"px";
  win.style.height=height+"px";

  win.style.left=
    Math.max(10,(vw-width)/2)+"px";

  win.style.top=
    Math.max(10,(vh-height)/2)+"px";

  win.style.zIndex=++zIndex;

  win.innerHTML=`
    <div class="titlebar">

      <div class="title">
        ${options.title}
      </div>

      <div class="window-buttons">

        <button data-action="min">
          ─
        </button>

        <button data-action="max">
          ☐
        </button>

        <button class="close" data-action="close">
          ✕
        </button>

      </div>

    </div>

    <div class="win-body">
      ${options.body||""}
    </div>
  `;

  document.body.appendChild(win);

  /* Focus */

  win.addEventListener("pointerdown",()=>{
    win.style.zIndex=++zIndex;
  });

  /* Dragging */

  const bar=win.querySelector(".titlebar");

  let drag=null;

  bar.addEventListener("pointerdown",e=>{

    if(e.target.closest("button")) return;

    if(win.classList.contains("max")) return;

    drag={
      x:e.clientX-win.offsetLeft,
      y:e.clientY-win.offsetTop
    };

    bar.setPointerCapture(e.pointerId);

  });

  bar.addEventListener("pointermove",e=>{

    if(!drag) return;

    win.style.left=
      Math.max(
        0,
        e.clientX-drag.x
      )+"px";

    win.style.top=
      Math.max(
        0,
        e.clientY-drag.y
      )+"px";

  });

  bar.addEventListener("pointerup",()=>{
    drag=null;
  });

  bar.addEventListener("dblclick",e=>{

    if(e.target.closest("button")) return;

    win.classList.toggle("max");

  });

  /* Window controls */

  win.querySelector(".window-buttons")
    .addEventListener("click",e=>{

      const action=
        e.target.dataset.action;

      if(action==="min"){
        win.classList.add("min");
      }

      if(action==="max"){
        win.classList.toggle("max");
      }

      if(action==="close"){
        win.remove();
      }

    });

  return win;
}

function signIn(){

  const username=
    $("#login-user").value.trim();

  const password=
    $("#login-pass").value;

  const msg=$("#auth-msg");

  if(username.length<2){
    msg.textContent="Enter a username.";
    return;
  }

  if(password.length<1){
    msg.textContent="Enter a password.";
    return;
  }

  /*
    LOCAL DEMO LOGIN

    The password is NOT sent anywhere.
    This is not a real online authentication system.
  */

  currentUser={
    username:username
  };

  save("user",currentUser);

  updateUserUI();

  toast("Signed in as "+username);

  const win=$("#win-login");

  if(win) win.remove();

}

function signOut(){

  currentUser=null;

  save("user",null);

  updateUserUI();

  toast("Signed out");

  const win=$("#win-login");

  if(win) win.remove();
}

function updateUserUI(){

  $("#start-user").textContent=
    currentUser
    ? "Signed in: "+currentUser.username
    : "Not signed in";

}

function escapeHTML(text){

  return text
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}

    rebuildDesktop();

    toast(game.name+" installed");

  }else{

    openGame(game);

function rebuildDesktop(){

  const desktop=
    $("#desktop");

  desktop.innerHTML="";

  const baseApps=[
    {
      name:"App Store",
      icon:"🛍️",
      color:"#0078d4",
      fn:openStore
    },
    {
      name:"Discord",
      icon:"💬",
      color:"#5865f2",
      fn:openDiscord
    },
    {
      name:"TikTok",

      fn:openTikTok
    },
    {
      name:"Settings",
      icon:"⚙️",
      color:"#555",
      fn:openSettings
    }
  ];

  baseApps.forEach(addDesktopIcon);

  GAMES
    .filter(game=>installed.includes(game.id))
    .forEach(game=>{

    >

    <span>
      ${app.name}

  el.onclick=app.fn;

  $("#desktop").appendChild(el);

}

function filterStart(query){

  document
    .querySelectorAll(".start-item")
    .forEach(item=>{

      item.style.display=
        !query ||
        item.dataset.name.includes(query)
          ? ""
          : "none";

    });

}
