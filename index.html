<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SoxlaOS</title>

<link id="favicon" rel="icon"
href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230078d4'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' fill='white' font-family='Arial'%3ES%3C/text%3E%3C/svg%3E">

<style>
:root{
  --accent:#0078d4;
  --accent-hover:#1a86d9;
  --accent-glow:rgba(0,120,212,.45);
  --taskbar:rgba(18,18,22,.84);
  --window:#1e1e24;
  --window-header:#2a2a32;
  --text:#f3f3f3;
  --muted:#a8a8b3;
  --card:#2a2a32;
  --danger:#c42b1c;
  --success:#0f9d58;
  --radius:10px;
  --shadow:0 20px 60px rgba(0,0,0,.55);
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  overflow:hidden;
  font-family:"Segoe UI",system-ui,sans-serif;
  color:var(--text);
  user-select:none;
}

body{
  background:var(--wallpaper,linear-gradient(135deg,#0f2027,#203a43,#2c5364));
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
}

/* LOGIN */

#login{
  position:fixed;
  inset:0;
  z-index:50000;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(circle at 50% 30%,rgba(0,120,212,.2),transparent 40%),
    #050508;
}

.login-box{
  width:min(400px,calc(100vw - 30px));
  background:rgba(28,28,35,.94);
  border:1px solid rgba(255,255,255,.1);
  border-radius:18px;
  padding:30px;
  box-shadow:0 30px 100px rgba(0,0,0,.6);
}

.login-logo{
  width:72px;
  height:72px;
  margin:0 auto 18px;
  border-radius:18px;
  display:grid;
  place-items:center;
  font-size:32px;
  font-weight:800;
  background:linear-gradient(145deg,#0078d4,#00bcf2);
  box-shadow:0 0 40px rgba(0,120,212,.45);
}

.login-box h1{
  text-align:center;
  font-size:25px;
  margin-bottom:6px;
}

.login-sub{
  text-align:center;
  color:var(--muted);
  font-size:13px;
  margin-bottom:25px;
}

.login-input{
  width:100%;
  background:#17171d;
  border:1px solid #3a3a44;
  color:white;
  padding:12px 14px;
  border-radius:9px;
  outline:none;
  margin-bottom:10px;
  font-size:14px;
}

.login-input:focus{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-glow);
}

.login-btn{
  width:100%;
  border:0;
  background:var(--accent);
  color:white;
  padding:12px;
  border-radius:9px;
  font-weight:700;
  cursor:pointer;
  margin-top:6px;
}

.login-btn:hover{
  background:var(--accent-hover);
}

.login-secondary{
  width:100%;
  border:0;
  background:#35353f;
  color:white;
  padding:11px;
  border-radius:9px;
  cursor:pointer;
  margin-top:8px;
}

.login-message{
  min-height:20px;
  text-align:center;
  margin-top:12px;
  color:#ffb4ab;
  font-size:12px;
}

.login-note{
  margin-top:18px;
  color:#777;
  font-size:10px;
  text-align:center;
  line-height:1.5;
}

/* BOOT */

#boot{
  position:fixed;
  inset:0;
  background:#050508;
  z-index:40000;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:25px;
  transition:opacity .6s;
}

#boot.hide{
  opacity:0;
  pointer-events:none;
}

.boot-logo{
  width:80px;
  height:80px;
  border-radius:20px;
  display:grid;
  place-items:center;
  font-weight:800;
  font-size:32px;
  background:linear-gradient(145deg,#0078d4,#00bcf2);
  box-shadow:0 0 50px rgba(0,120,212,.5);
  animation:pulse 1.6s infinite;
}

@keyframes pulse{
  50%{transform:scale(1.05)}
}

.spinner{
  width:30px;
  height:30px;
  border:3px solid #2a2a32;
  border-top-color:white;
  border-radius:50%;
  animation:spin .75s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg)}
}

.boot-text{
  color:#666;
  font-size:13px;
  letter-spacing:3px;
}

/* DESKTOP */

#desktop{
  position:absolute;
  inset:0 0 56px 0;
  padding:18px 12px;
  display:flex;
  flex-direction:column;
  flex-wrap:wrap;
  align-content:flex-start;
  gap:10px;
}

.desk-icon{
  width:90px;
  height:98px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  border-radius:10px;
  cursor:pointer;
  padding:8px;
}

.desk-icon:hover{
  background:rgba(255,255,255,.12);
  transform:translateY(-1px);
}

.desk-icon .ico{
  width:48px;
  height:48px;
  border-radius:12px;
  display:grid;
  place-items:center;
  font-size:26px;
  box-shadow:0 6px 18px rgba(0,0,0,.4);
  overflow:hidden;
  background:#333;
}

.desk-icon .ico img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.desk-icon span{
  font-size:12px;
  text-align:center;
  text-shadow:0 1px 4px #000;
}

/* TASKBAR */

#taskbar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:56px;
  background:var(--taskbar);
  backdrop-filter:blur(28px) saturate(1.5);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  border-top:1px solid rgba(255,255,255,.08);
  z-index:9000;
}

.tb-btn{
  height:42px;
  min-width:42px;
  padding:0 11px;
  border:0;
  background:transparent;
  color:white;
  border-radius:8px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:6px;
  font-size:18px;
}

.tb-btn:hover,
.tb-btn.active{
  background:rgba(255,255,255,.12);
}

.tb-pinned{
  width:44px;
  height:42px;
}

.tb-pinned.open::after{
  content:"";
  position:absolute;
  bottom:5px;
  width:18px;
  height:3px;
  border-radius:2px;
  background:var(--accent);
}

#clock{
  position:absolute;
  right:14px;
  top:50%;
  transform:translateY(-50%);
  text-align:right;
  font-size:12px;
  line-height:1.3;
}

#start-logo{
  width:24px;
  height:24px;
  background:conic-gradient(
    from 90deg,
    #f25022 0 90deg,
    #7fba00 90deg 180deg,
    #00a4ef 180deg 270deg,
    #ffb900 270deg
  );
  border-radius:4px;
}

/* START */

#start{
  position:fixed;
  left:50%;
  bottom:66px;
  transform:translateX(-50%) scale(.94);
  width:min(680px,calc(100vw - 16px));
  background:rgba(28,28,34,.95);
  backdrop-filter:blur(36px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:16px;
  padding:20px;
  z-index:9100;
  opacity:0;
  pointer-events:none;
  transition:.18s;
  box-shadow:var(--shadow);
}

#start.show{
  opacity:1;
  pointer-events:auto;
  transform:translateX(-50%) scale(1);
}

.start-search{
  width:100%;
  background:rgba(255,255,255,.06);
  border:1px solid rgba(255,255,255,.1);
  color:white;
  padding:10px 14px;
  border-radius:10px;
  outline:none;
  margin-bottom:16px;
}

.start-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(96px,1fr));
  gap:10px;
  max-height:320px;
  overflow:auto;
}

.start-item{
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  border-radius:12px;
  padding:14px 8px;
  text-align:center;
  cursor:pointer;
}

.start-item:hover{
  background:rgba(255,255,255,.1);
  transform:translateY(-2px);
}

.start-item .ico{
  width:40px;
  height:40px;
  margin:auto auto 8px;
  border-radius:10px;
  display:grid;
  place-items:center;
  font-size:22px;
  overflow:hidden;
}

.start-item .ico img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.start-item p{
  font-size:12px;
}

/* WINDOWS */

.win{
  position:absolute;
  min-width:300px;
  min-height:200px;
  background:var(--window);
  border:1px solid rgba(255,255,255,.1);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  z-index:100;
  animation:winIn .22s;
}

@keyframes winIn{
  from{
    opacity:0;
    transform:scale(.96) translateY(8px);
  }
}

.win.max{
  top:0!important;
  left:0!important;
  width:100%!important;
  height:calc(100% - 56px)!important;
  border-radius:0;
}

.win.min{
  display:none;
}

.titlebar{
  height:38px;
  background:var(--window-header);
  display:flex;
  align-items:center;
  padding-left:14px;
  cursor:grab;
  flex-shrink:0;
}

.titlebar .t{
  flex:1;
  font-size:13px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.win-btns{
  display:flex;
  height:100%;
}

.win-btns button{
  width:48px;
  height:100%;
  border:0;
  background:transparent;
  color:#ddd;
  cursor:pointer;
}

.win-btns button:hover{
  background:rgba(255,255,255,.1);
}

.win-btns .close:hover{
  background:var(--danger);
}

.win-body{
  flex:1;
  overflow:auto;
  position:relative;
  background:#16161c;
}

/* STORE */

.store{
  padding:20px;
}

.store-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-bottom:18px;
  flex-wrap:wrap;
}

.store-head h2{
  font-size:24px;
}

.search{
  background:#2c2c34;
  border:1px solid #3e3e48;
  color:white;
  padding:9px 14px;
  border-radius:8px;
  min-width:220px;
}

.store-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(170px,1fr));
  gap:14px;
}

.app-card{
  background:var(--card);
  border-radius:14px;
  padding:16px 14px 14px;
  cursor:pointer;
  border:1px solid rgba(255,255,255,.05);
}

.app-card:hover{
  transform:translateY(-3px);
  background:#32323c;
}

.app-card .badge{
  width:56px;
  height:56px;
  border-radius:14px;
  display:grid;
  place-items:center;
  font-size:28px;
  margin-bottom:12px;
  overflow:hidden;
}

.app-card .badge img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.app-card h4{
  font-size:14px;
  margin-bottom:4px;
}

.app-card p{
  font-size:11px;
  color:var(--muted);
}

.get-btn{
  margin-top:12px;
  width:100%;
  background:var(--accent);
  border:0;
  color:white;
  padding:8px;
  border-radius:8px;
  font-weight:600;
  cursor:pointer;
}

.get-btn.installed{
  background:#3a3a44;
}

.get-btn.downloading{
  background:#2a4a6a;
  pointer-events:none;
}

.progress-bar{
  height:3px;
  width:0;
  background:var(--accent);
  margin-top:8px;
}

/* GAME */

.game-toolbar{
  height:40px;
  background:#22222a;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  border-bottom:1px solid #333;
}

.game-toolbar button{
  background:#3a3a44;
  border:0;
  color:white;
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}

.game-toolbar button:hover{
  background:#4a4a54;
}

.game-toolbar button.primary{
  background:var(--accent);
}

.urlchip{
  flex:1;
  background:#1a1a20;
  padding:5px 10px;
  border-radius:6px;
  color:#888;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
  font-size:11px;
}

.game-frame-wrap{
  position:absolute;
  inset:40px 0 0 0;
  background:#0a0a0e;
  overflow:auto;
}

.game-content{
  width:100%;
  height:100%;
  background:#0a0a0e;
  color:white;
  overflow:auto;
}

.game-error{
  min-height:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:30px;
  text-align:center;
}

.game-error p{
  max-width:500px;
  color:var(--muted);
  font-size:13px;
  line-height:1.5;
}

/* SETTINGS */

.settings{
  display:flex;
  height:100%;
}

.set-nav{
  width:210px;
  background:#18181e;
  border-right:1px solid #2e2e36;
  padding:14px 10px;
}

.set-nav button{
  width:100%;
  text-align:left;
  background:transparent;
  border:0;
  color:#ddd;
  padding:10px 14px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:3px;
}

.set-nav button:hover,
.set-nav button.on{
  background:#2c2c34;
}

.set-page{
  flex:1;
  padding:22px;
  overflow:auto;
}

.set-page h2{
  font-size:22px;
  margin-bottom:6px;
}

.sub{
  color:var(--muted);
  font-size:13px;
  margin-bottom:20px;
}

.paper-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(150px,1fr));
  gap:12px;
}

.paper{
  height:96px;
  border-radius:10px;
  cursor:pointer;
  border:2px solid transparent;
  background-size:cover;
  background-position:center;
}

.paper.on,
.paper:hover{
  border-color:var(--accent);
}

.paper .label{
  display:block;
  margin-top:70px;
  padding:6px;
  background:rgba(0,0,0,.55);
  font-size:11px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:#24242c;
  padding:14px 16px;
  border-radius:10px;
  margin-bottom:10px;
  gap:15px;
}

.row h4{
  font-size:14px;
}

.row p{
  font-size:12px;
  color:var(--muted);
  margin-top:3px;
}

.action{
  background:var(--accent);
  color:white;
  border:0;
  padding:9px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:600;
}

.action.ghost{
  background:#3a3a44;
}

.toggle{
  width:46px;
  height:26px;
  border-radius:13px;
  background:#555;
  position:relative;
  cursor:pointer;
  border:0;
  flex-shrink:0;
}

.toggle.on{
  background:var(--accent);
}

.toggle::after{
  content:"";
  position:absolute;
  top:3px;
  left:3px;
  width:20px;
  height:20px;
  background:white;
  border-radius:50%;
  transition:.15s;
}

.toggle.on::after{
  left:23px;
}

/* SOCIAL */

.social-buttons{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}

.social-btn{
  border:0;
  padding:10px 16px;
  border-radius:9px;
  color:white;
  cursor:pointer;
  font-weight:600;
}

.discord{
  background:#5865f2;
}

.tiktok{
  background:#111;
  border:1px solid #444;
}

/* TOAST */

#toast{
  position:fixed;
  bottom:72px;
  left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,38,.95);
  color:white;
  padding:12px 20px;
  border-radius:10px;
  font-size:13px;
  z-index:30000;
  opacity:0;
  pointer-events:none;
  transition:.25s;
}

#toast.show{
  opacity:1;
  transform:translateX(-50%);
}

/* MOBILE */

@media(max-width:700px){

  .set-nav{
    width:68px;
  }

  .set-nav button{
    font-size:0;
    text-align:center;
    padding:12px 8px;
  }

  .desk-icon{
    width:76px;
  }

  .clock{
    display:none;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="login">

  <div class="login-box">

    <div class="login-logo">S</div>

    <h1>Welcome to SoxlaOS</h1>

    <div class="login-sub">
      Sign in to your local SoxlaOS account
    </div>

    <input
      id="username"
      class="login-input"
      placeholder="Username"
      autocomplete="username">

    <input
      id="password"
      class="login-input"
      type="password"
      placeholder="Password"
      autocomplete="current-password">

    <button class="login-btn" id="loginBtn">
      Sign In
    </button>

    <button class="login-secondary" id="createBtn">
      Create Account
    </button>

    <div class="login-message" id="loginMessage"></div>

    <div class="login-note">
      Demo/local account system. Account information is stored
      only in this browser.
    </div>

  </div>

</div>


<!-- BOOT -->

<div id="boot">

  <div class="boot-logo">S</div>

  <div class="spinner"></div>

  <div class="boot-text">SOXLAOS</div>

</div>


<!-- DESKTOP -->

<div id="desktop"></div>

<div id="toast"></div>


<!-- START -->

<div id="start">

  <input
    class="start-search"
    id="start-search"
    placeholder="Search apps…">

  <h3>Pinned</h3>

  <div
    class="start-grid"
    id="start-grid">
  </div>

</div>


<!-- TASKBAR -->

<div id="taskbar">

  <button
    class="tb-btn"
    id="start-btn"
    title="Start">

    <div id="start-logo"></div>

  </button>

  <button
    class="tb-btn tb-pinned"
    data-app="store"
    title="App Store">

    🛍️

  </button>

  <button
    class="tb-btn tb-pinned"
    data-app="settings"
    title="Settings">

    ⚙️

  </button>

  <button
    class="tb-btn tb-pinned"
    data-app="social"
    title="Social">

    💬

  </button>

  <div id="clock"></div>

</div>

/* =========================================================
   STORAGE
========================================================= */

function save(key,value){

  try{

    localStorage.setItem(
      'soxla_' + key,
      JSON.stringify(value)
    );

  }catch(e){}

}


function load(key,fallback){

  try{

    const value =
      localStorage.getItem('soxla_' + key);

    return value
      ? JSON.parse(value)
      : fallback;

  }catch(e){

    return fallback;

  }

}


/* =========================================================
   LOGIN
========================================================= */

let accounts = load('accounts',[]);
let currentUser = load('currentUser',null);


function showLogin(){

  document.getElementById('login').style.display='flex';

}


function hideLogin(){

  document.getElementById('login').style.display='none';

}


function login(){

  const username =
    document.getElementById('username')
      .value.trim();

  const password =
    document.getElementById('password')
      .value;

  const msg =
    document.getElementById('loginMessage');

  if(!username || !password){

    msg.textContent =
      'Enter a username and password.';

    return;

  }

  const account =
    accounts.find(
      a =>
        a.username.toLowerCase()
        === username.toLowerCase()
        &&
        a.password === password
    );

  if(!account){

    msg.textContent =
      'Incorrect username or password.';

    return;

  }

  currentUser = {
    username:account.username
  };

  save('currentUser',currentUser);

  msg.textContent='';

  hideLogin();

  boot();

}


function createAccount(){

  const username =
    document.getElementById('username')
      .value.trim();

  const password =
    document.getElementById('password')
      .value;

  const msg =
    document.getElementById('loginMessage');

  if(username.length < 3){

    msg.textContent =
      'Username must be at least 3 characters.';

    return;

  }

  if(password.length < 4){

    msg.textContent =
      'Password must be at least 4 characters.';

    return;

  }

  if(
    accounts.some(
      a =>
        a.username.toLowerCase()
        === username.toLowerCase()
    )
  ){

    msg.textContent =
      'That username already exists.';

    return;

  }

  accounts.push({
    username,
    password
  });

  save('accounts',accounts);

  currentUser={username};

  save('currentUser',currentUser);

  msg.textContent='';

  hideLogin();

  boot();

}


function logout(){

  currentUser=null;

  save('currentUser',null);

  document
    .querySelectorAll('.win')
    .forEach(w=>w.remove());

  showLogin();

}

   WINDOWS

let zTop=200;


function focusWin(win){

  win.style.zIndex=++zTop;

}


function makeWindow({
  id,
  title,
  width=860,
  height=560,
  bodyHTML,
  onClose
}){

  const existing =
    document.getElementById('win-'+id);

  if(existing){

    existing.classList.remove('min');

    focusWin(existing);

    markPinned(id,true);

    return existing;

  }

  const win=
    document.createElement('div');

  win.className='win';

  win.id='win-'+id;

  const vw=window.innerWidth;

  const vh=window.innerHeight-56;

  win.style.width =
    Math.min(width,vw-20)+'px';

  win.style.height =
    Math.min(height,vh-20)+'px';

  win.style.left =
    Math.max(
      10,
      (vw-width)/2
    )+'px';

  win.style.top =
    Math.max(
      10,
      (vh-height)/3
    )+'px';

  win.innerHTML=`

    <div class="titlebar">

      <div class="t">
        ${title}
      </div>

      <div class="win-btns">

        <button data-act="min">
          ─
        </button>

        <button data-act="max">
          ☐
        </button>

        <button
          class="close"
          data-act="close">
          ✕
        </button>

      </div>

    </div>

    <div class="win-body">
      ${bodyHTML}
    </div>

  `;

  document.body.appendChild(win);

  focusWin(win);

  markPinned(id,true);


  win.addEventListener(
    'pointerdown',
    ()=>focusWin(win)
  );


  const bar =
    win.querySelector('.titlebar');

  let drag=null;


  bar.addEventListener(
    'pointerdown',
    e=>{

      if(e.target.closest('button'))
        return;

      if(win.classList.contains('max'))
        return;

      drag={
        dx:e.clientX-win.offsetLeft,
        dy:e.clientY-win.offsetTop
      };

      bar.setPointerCapture(
        e.pointerId
      );

    }
  );


  bar.addEventListener(
    'pointermove',
    e=>{

      if(!drag)return;

      win.style.left =
        Math.max(
          0,
          e.clientX-drag.dx
        )+'px';

      win.style.top =
        Math.max(
          0,
          e.clientY-drag.dy
        )+'px';

    }
  );


  bar.addEventListener(
    'pointerup',
    ()=>drag=null
  );


  bar.addEventListener(
    'dblclick',
    ()=>win.classList.toggle('max')
  );


  win.querySelector(
    '.win-btns'
  ).addEventListener(
    'click',
    e=>{

      const act=e.target.dataset.act;

      if(act==='min')
        win.classList.add('min');

      if(act==='max')
        win.classList.toggle('max');

      if(act==='close'){

        win.remove();

        markPinned(id,false);

        if(onClose)
          onClose();

      }

    }
  );


  return win;

}


function markPinned(id,open){

  document
    .querySelectorAll('.tb-pinned')
    .forEach(btn=>{

      if(btn.dataset.app===id){

        btn.classList.toggle(
          'open',
          open
        );

      }

    });

}

/* =========================================================
   STORE
========================================================= */

let installed=load('installed',[]);


function isInstalled(id){

  return installed.includes(id);

}


function installGame(g,card){

  if(isInstalled(g.id)){

    openGame(g);

    return;

  }

  const btn=
    card.querySelector('.get-btn');

  const bar=
    card.querySelector('.progress-bar');

  btn.classList.add('downloading');

  let progress=0;

  const interval=setInterval(()=>{

    progress +=
      Math.random()*14+5;

    if(progress>=100){

      progress=100;

      clearInterval(interval);

      btn.textContent='Installing…';

      setTimeout(()=>{

        installed.push(g.id);

        save('installed',installed);

        btn.classList.remove(
          'downloading'
        );

        btn.classList.add(
          'installed'
        );

        btn.textContent='Open';

        bar.style.width='0';

        rebuildDesktop();

        rebuildStart();

        toast(
          g.name+' installed'
        );

      },400);

    }else{

      btn.textContent=
        'Downloading… '+
        Math.floor(progress)+'%';

    }

    bar.style.width=
      progress+'%';

  },120);

}

/* =========================================================
   FETCH GAME LOADER
========================================================= */

async function openGame(g){

  if(!isInstalled(g.id)){

    toast(
      'Install '+g.name+
      ' from the App Store first'
    );

    openStore();

    return;

  }


  toggleStart(false);


  const win=makeWindow({

    id:'game-'+g.id,

    title:
      g.name+' — SoxlaOS',

    width:980,

    height:640,

    bodyHTML:`

      <div class="game-toolbar">

        <button
          onclick="reloadGame('${g.id}')">

          Reload

        </button>

        <button
          class="primary"
          onclick="fullscreenGame('${g.id}')">

          Fullscreen

        </button>

        <div class="urlchip">
          ${g.url}
        </div>

      </div>

      <div class="game-frame-wrap">

        <div
          class="game-loading"
          id="load-${g.id}"
          style="
            position:absolute;
            inset:0;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            gap:16px;
            background:#0a0a0e;
            z-index:2;
          ">

          <div class="spinner"></div>

          <div>
            Loading ${g.name}…
          </div>

        </div>

        <div
          class="game-content"
          id="content-${g.id}">
        </div>

      </div>

    `

  });


  const loading=
    document.getElementById(
      'load-'+g.id
    );

  const content=
    document.getElementById(
      'content-'+g.id
    );


  try{

    const response=
      await fetch(
        g.url,
        {
          method:'GET',
          mode:'cors',
          credentials:'omit',
          redirect:'follow'
        }
      );


    if(!response.ok){

      throw new Error(
        'HTTP '+response.status
      );

    }


    const html=
      await response.text();


    loading.style.display='none';


    const parser=
      new DOMParser();

    const doc=
      parser.parseFromString(
        html,
        'text/html'
      );


    content.innerHTML='';


    /*
      Establish the original URL
      for relative resources.
    */

    const base=
      document.createElement('base');

    base.href=
      new URL(
        g.url
      ).href;

    content.appendChild(base);


    /*
      Copy styles.
    */

    doc
      .querySelectorAll('style')
      .forEach(oldStyle=>{

        const style=
          document.createElement('style');

        style.textContent=
          oldStyle.textContent;

        content.appendChild(style);

      });


    /*
      Copy body elements.
    */

    if(doc.body){

      Array
        .from(doc.body.children)
        .forEach(node=>{

          content.appendChild(
            node.cloneNode(true)
          );

        });

    }


    /*
      Copy scripts.

      Note: external pages may still
      fail because of their own
      security policies.
    */

    doc
      .querySelectorAll('script')
      .forEach(oldScript=>{

        const script=
          document.createElement('script');

        if(oldScript.src){

          script.src=
            new URL(
              oldScript.getAttribute('src'),
              g.url
            ).href;

        }else{

          script.textContent=
            oldScript.textContent;

        }

        if(oldScript.type){

          script.type=
            oldScript.type;

        }

        content.appendChild(script);

      });


    toast(
      g.name+' loaded'
    );


  }catch(error){

    console.error(error);

    loading.style.display='none';


    content.innerHTML=`

      <div class="game-error">

        <div style="font-size:50px">
          ${g.emoji}
        </div>

        <h3>
          ${g.name} couldn't be loaded
        </h3>

        <p>
          The remote website did not allow
          SoxlaOS to download its page.
        </p>

        <p>
          Browser security restrictions
          such as CORS can prevent this.
        </p>

        <p style="font-size:10px">
          ${error.message}
        </p>

        <button
          class="action"
          onclick="reloadGame('${g.id}')">

          Try Again

        </button>

      </div>

    `;

  }

}


function reloadGame(id){

  const game=
    GAMES.find(
      g=>g.id===id
    );

  if(!game)return;

  const content=
    document.getElementById(
      'content-'+id
    );

  const loading=
    document.getElementById(
      'load-'+id
    );

  if(content)
    content.innerHTML='';

  if(loading)
    loading.style.display='flex';

  openGame(game);

}


function fullscreenGame(id){

  const content=
    document.getElementById(
      'content-'+id
    );

  if(
    content &&
    content.requestFullscreen
  ){

    content.requestFullscreen();

  }

}

              .forEach(p=>
                p.classList.remove('on')
              );

            paper.classList.add('on');

          };

        });

    }


    if(tab==='account'){

      const logout=
        page.querySelector(
          '#logoutBtn'
        );

      if(logout){

        logout.onclick=logout;

      }

    }


    if(tab==='social'){

      page
        .querySelector('#discordBtn')
        .onclick=()=>{

          location.href=
            'https://discord.com';

        };


      page
        .querySelector('#tiktokBtn')
        .onclick=()=>{

          location.href=
            'https://www.tiktok.com';

        };

    }

  }


  win
    .querySelector('.set-nav')
    .addEventListener(
      'click',
      e=>{

        const btn=
          e.target.closest('button');

        if(btn)
          showTab(btn.dataset.tab);

      }
    );


  showTab('personalize');

}


/* =========================================================
   DESKTOP
========================================================= */

function rebuildDesktop(){

  const desktop=
    $('#desktop');

  desktop.innerHTML='';


  const system=[

    {
      name:'App Store',
      emoji:'🛍️',
      bg:'#0078d4',
      fn:openStore
    },

    {
      name:'Settings',
      emoji:'⚙️',
      bg:'#5a5a5a',
      fn:openSettings
    },

    {
      name:'Social',
      emoji:'🌐',
      bg:'#5865f2',
      fn:openSocial
    }

  ];


  const games=
    GAMES
      .filter(g=>isInstalled(g.id))
      .map(g=>({

        name:g.name,
        emoji:g.emoji,
        bg:g.color,
        fn:()=>openGame(g),
        icon:g.icon

      }));


  [...system,...games]
    .forEach(item=>{

      const el=
        document.createElement('div');

      el.className='desk-icon';

      const image=
        item.icon
          ? `
            <img
              src="${item.icon}"
              alt=""
              onerror="
                this.style.display='none';
                this.parentElement.textContent='${item.emoji}'
              ">
          `
          : item.emoji;


      el.innerHTML=`

        <div
          class="ico"
          style="background:${item.bg}">

          ${image}

        </div>

        <span>
          ${item.name}
        </span>

      `;


      el.onclick=item.fn;

      desktop.appendChild(el);

    });

}


/* =========================================================
   START APPS
========================================================= */

function rebuildStart(){

  const grid=
    $('#start-grid');

  grid.innerHTML='';


  const items=[

    {
      name:'App Store',
      emoji:'🛍️',
      fn:openStore
    },

    {
      name:'Settings',
      emoji:'⚙️',
      fn:openSettings
    },

    {
      name:'Social',
      emoji:'🌐',
      fn:openSocial
    }

  ];


  GAMES
    .filter(g=>isInstalled(g.id))
    .forEach(g=>{

      items.push({

        name:g.name,
        emoji:g.emoji,
        fn:()=>openGame(g),
        icon:g.icon

      });

    });


  items.forEach(item=>{

    const el=
      document.createElement('div');

    el.className='start-item';

    const icon=
      item.icon
        ? `
          <img
            src="${item.icon}"
            alt=""
            onerror="
              this.style.display='none';
              this.parentElement.textContent='${item.emoji}'
            ">
        `
        : item.emoji;


    el.innerHTML=`

      <div class="ico">
        ${icon}
      </div>

      <p>
        ${item.name}
      </p>

    `;


    el.dataset.name=
      item.name.toLowerCase();


    el.onclick=()=>{

      toggleStart(false);

      item.fn();

    };


    grid.appendChild(el);

  });

}


function filterStart(query){

  document
    .querySelectorAll(
      '#start-grid .start-item'
    )
    .forEach(item=>{

      item.style.display=
        !query ||
        item.dataset.name.includes(query)
          ? ''
          : 'none';

    });

}


/* =========================================================
   BOOT
========================================================= */

function boot(){

  const bootScreen=
    document.getElementById('boot');

  bootScreen.classList.remove('hide');

  bootScreen.style.opacity='1';

  setTimeout(()=>{

    bootScreen.classList.add('hide');

  },900);

}


/* =========================================================
   BUTTON EVENTS
========================================================= */

document
  .getElementById('loginBtn')
  .onclick=login;


document
  .getElementById('createBtn')
  .onclick=createAccount;


document
  .getElementById('start-btn')
  .onclick=()=>toggleStart();


document
  .querySelector('[data-app="store"]')
  .onclick=openStore;


document
  .querySelector('[data-app="settings"]')
  .onclick=openSettings;


document
  .querySelector('[data-app="social"]')
  .onclick=openSocial;


document
  .getElementById('start-search')
  .addEventListener(
    'input',
    e=>filterStart(
      e.target.value.toLowerCase()
    )
  );


/* Enter key login */

document.addEventListener(
  'keydown',
  e=>{

    if(
      e.key==='Enter' &&
      document
        .getElementById('login')
        .style.display!=='none'
    ){

      login();

    }

  }
);


/* =========================================================
   INITIALIZE
========================================================= */

const savedWallpaper=
  load('wallpaper','bloom');

applyWallpaper(savedWallpaper);

rebuildDesktop();
rebuildStart();


if(currentUser){

  hideLogin();

  boot();

}else{

  document
    .getElementById('login')
    .style.display='flex';

  document
    .getElementById('boot')
    .style.display='none';

}

</script>
